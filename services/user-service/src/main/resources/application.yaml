spring:
  application:
    name: customer-service

  # Reactive connection (R2DBC)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneta_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  # Blocking connection (JDBC) for Flyway
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneta_db}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

server:
  port: ${USER_SERVICE_PORT:8081}